name: Daily news briefing

# Runs every morning and evening to keep the briefing fresh
# Fetches from curated RSS sources, AI-summarises each story, saves to briefing.json
on:
  schedule:
    - cron: '0 17 * * 1-5'              # 10:30 PM IST Mon-Fri (Step 6 — end of daily chain)
    - cron: '0 2,5,8,11,14,20,23 * * 1-5'  # Every 3 hours rest of day Mon-Fri (skip 17:00 — handled above)
    - cron: '0 4,10,16,22 * * 0,6'          # Every 6 hours Sat-Sun
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and summarise news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, time, urllib.request, urllib.error
          import xml.etree.ElementTree as ET

          API_KEY  = os.environ.get('GEMINI_API_KEY','')
          OUT_FILE = 'docs/data/briefing.json'
          MAX_PER_CAT = 6     # stories per category (fewer = faster runs)
          DELAY       = 2.5   # seconds between Gemini calls

          # ── Curated RSS sources per category ──────────────────────────
          SOURCES = {
              'Markets': [
                  'https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms',
                  'https://www.business-standard.com/rss/markets-106.rss',
                  'https://feeds.feedburner.com/ndtvprofit-latest',
              ],
              'Geo-Political': [
                  'https://feeds.bbci.co.uk/news/world/rss.xml',
                  'https://rss.nytimes.com/services/xml/rss/nyt/World.xml',
                  'https://economictimes.indiatimes.com/news/international/rssfeeds/1564291100.cms',
              ],
              'AI & Tech': [
                  'https://feeds.feedburner.com/TechCrunch',
                  'https://www.theverge.com/rss/index.xml',
                  'https://feeds.arstechnica.com/arstechnica/index',
              ],
              'Data & Insights': [
                  'https://economictimes.indiatimes.com/news/economy/rssfeeds/1373380232.cms',
                  'https://www.livemint.com/rss/economy',
                  'https://hbr.org/rss',
              ],
              'India': [
                  'https://feeds.feedburner.com/ndtvnews-india-news',
                  'https://economictimes.indiatimes.com/news/india/rssfeeds/1514091.cms',
                  'https://www.thehindu.com/news/national/feeder/default.rss',
              ],
              'General': [
                  'https://feeds.bbci.co.uk/news/rss.xml',
                  'https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml',
                  'https://www.theatlantic.com/feed/all/',
              ],
          }

          UA = 'Mozilla/5.0 (compatible; RBKCompass/1.0; personal use)'

          def fetch_rss(url):
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': UA})
                  with urllib.request.urlopen(req, timeout=12) as r:
                      return r.read()
              except: return None

          def parse_rss(xml_bytes):
              if not xml_bytes: return []
              try:
                  root = ET.fromstring(xml_bytes)
                  items = []
                  for item in root.findall('.//item')[:6]:
                      title   = (item.findtext('title') or '').strip()
                      link    = (item.findtext('link')  or '').strip()
                      desc    = (item.findtext('description') or '').strip()
                      pubdate = (item.findtext('pubDate') or '').strip()
                      # Strip HTML tags from description
                      import re
                      desc = re.sub(r'<[^>]+>', '', desc)[:400]
                      if title and link:
                          items.append({'title':title,'link':link,'desc':desc,'pubDate':pubdate})
                  return items
              except: return []

          # Discover working Gemini model
          CANDIDATES = [
              'gemini-flash-lite-latest',
              'gemini-flash-latest',
              'gemini-2.0-flash-lite-001',
              'gemini-2.0-flash-001',
          ]
          WORKING_URL = None
          WORKING_MODEL = 'none'

          if API_KEY:
              for cand in CANDIDATES:
                  url = f'https://generativelanguage.googleapis.com/v1beta/models/{cand}:generateContent?key={API_KEY}'
                  try:
                      body = json.dumps({'contents':[{'parts':[{'text':'Say OK'}]}],
                                         'generationConfig':{'maxOutputTokens':5}}).encode()
                      req = urllib.request.Request(url, data=body,
                            headers={'Content-Type':'application/json'}, method='POST')
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          json.loads(resp.read())
                      WORKING_URL = url
                      WORKING_MODEL = cand
                      print(f'Using model: {cand}')
                      break
                  except Exception as e:
                      print(f'  {cand}: {e}')
                      time.sleep(1)

          def summarise(title, desc, category):
              if not WORKING_URL:
                  return desc[:120] + '...' if len(desc) > 120 else desc
              prompt = '\n'.join([
                  f'Category: {category}',
                  f'Headline: {title}',
                  f'Original text: {desc}',
                  '',
                  'Write a 2-sentence plain English summary of this news story.',
                  'Be factual, specific, and concise. No filler phrases.',
                  'Reply with ONLY the 2-sentence summary, nothing else.',
              ])
              try:
                  body = json.dumps({
                      'contents':[{'parts':[{'text':prompt}]}],
                      'generationConfig':{'temperature':0.2,'maxOutputTokens':120}
                  }).encode()
                  req = urllib.request.Request(WORKING_URL, data=body,
                        headers={'Content-Type':'application/json'}, method='POST')
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      raw = json.loads(resp.read())
                  return raw['candidates'][0]['content']['parts'][0]['text'].strip()
              except Exception as e:
                  print(f'    Summary error: {e}')
                  return desc[:120] + '...' if len(desc) > 120 else desc

          # ── Main loop ──────────────────────────────────────────────────
          result = {}
          total_stories = 0

          for category, urls in SOURCES.items():
              print(f'\n{category}...')
              raw_items = []
              for url in urls:
                  xml_bytes = fetch_rss(url)
                  items = parse_rss(xml_bytes)
                  raw_items.extend(items)
                  if len(raw_items) >= MAX_PER_CAT * 2: break

              # Dedupe by title similarity and pick top MAX_PER_CAT
              seen_titles = set()
              unique = []
              for item in raw_items:
                  key = item['title'][:40].lower()
                  if key not in seen_titles:
                      seen_titles.add(key)
                      unique.append(item)
                  if len(unique) >= MAX_PER_CAT: break

              cat_stories = []
              for item in unique:
                  time.sleep(DELAY)
                  summary = summarise(item['title'], item['desc'], category)
                  cat_stories.append({
                      'title':   item['title'],
                      'summary': summary,
                      'link':    item['link'],
                      'source':  item['link'].split('/')[2].replace('www.',''),
                      'pubDate': item['pubDate'],
                  })
                  print(f'  ✓ {item["title"][:60]}')

              result[category] = cat_stories
              total_stories += len(cat_stories)

          os.makedirs(os.path.dirname(OUT_FILE), exist_ok=True)
          with open(OUT_FILE, 'w', encoding='utf-8') as f:
              json.dump({
                  'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                  'model': WORKING_MODEL,
                  'categories': list(SOURCES.keys()),
                  'briefing': result
              }, f, ensure_ascii=False, indent=1)

          print(f'\n✅ Done: {total_stories} stories across {len(result)} categories.')
          print(f'Wrote {OUT_FILE}')
          EOF

      - name: Commit briefing.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/briefing.json
          git diff --staged --quiet || git commit -m "Auto-update daily briefing"
          git pull --rebase origin main
          git push
