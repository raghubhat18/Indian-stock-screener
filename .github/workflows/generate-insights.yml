name: Generate AI insights

on:
  schedule:
    - cron: '45 17 * * 1-5'   # 11:15 PM IST weekdays (17:45 UTC) — runs after save-snapshots
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate insights
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, csv, json, time, glob, math, urllib.request, urllib.error

          API_KEY  = os.environ.get('GEMINI_API_KEY','')
          OUT_FILE = 'docs/data/insights.json'
          DELAY    = 5.0   # seconds between calls (12/min, under 15 RPM free limit)
          TOP_N    = 10    # stocks per category

          def write_out(insights, model, error=None):
              os.makedirs('docs/data', exist_ok=True)
              obj = {
                  'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                  'model': model, 'count': len(insights), 'insights': insights
              }
              if error: obj['error'] = error
              with open(OUT_FILE, 'w', encoding='utf-8') as f:
                  json.dump(obj, f, ensure_ascii=False, indent=1)

          if not API_KEY:
              print('No GEMINI_API_KEY secret set.')
              write_out({}, 'none', 'No API key')
              exit(0)

          # ── Load bhavcopy history (last 30 sessions) ──────────────────────
          BHAV_DIR = 'docs/data/bhavcopy'
          bhav_files = sorted(glob.glob(f'{BHAV_DIR}/*.csv'))
          if not bhav_files:
              print('No bhavcopy files found.')
              write_out({}, 'none', 'No bhavcopy data')
              exit(0)

          latest_prices = {}
          price_history = {}   # sym -> [{'c':close,'v':vol}, ...]

          for fp in bhav_files[-30:]:
              try:
                  with open(fp, encoding='utf-8-sig') as f:
                      for row in csv.DictReader(f):
                          if (row.get('SctySrs') or '').strip() != 'EQ': continue
                          sym = (row.get('TckrSymb') or '').strip().upper()
                          if not sym: continue
                          try:
                              c = float(row.get('ClsPric') or 0)
                              v = float(row.get('TtlTradgVol') or row.get('TotTrdQty') or 0)
                              p = float(row.get('PrvsClsgPric') or c)
                              if c > 0:
                                  price_history.setdefault(sym, []).append({'c': c, 'v': v})
                                  latest_prices[sym] = {
                                      'name': (row.get('FinInstrmNm') or sym).strip(),
                                      'price': c,
                                      'change_pct': (c - p) / p * 100 if p else 0
                                  }
                          except: pass
              except: pass

          print(f'Loaded {len(latest_prices)} symbols from {len(bhav_files[-30:])} sessions.')

          # ── Load fundamentals ──────────────────────────────────────────────
          fundamentals = {}
          fpath = 'docs/data/fundamentals.csv'
          if os.path.exists(fpath):
              with open(fpath, encoding='utf-8-sig') as f:
                  for row in csv.DictReader(f):
                      sym = (row.get('Symbol') or '').strip().upper()
                      if sym: fundamentals[sym] = row
              print(f'Loaded fundamentals for {len(fundamentals)} symbols.')

          # ── Load market cap map ───────────────────────────────────────────
          cap_map = {}
          cap_path = 'docs/data/market-cap.csv'
          if os.path.exists(cap_path):
              with open(cap_path, encoding='utf-8-sig') as f:
                  for row in csv.DictReader(f):
                      sym = (row.get('Symbol') or '').strip().upper()
                      cat = (row.get('Category') or '').strip()
                      if sym and cat: cap_map[sym] = cat

          # ── Score functions ───────────────────────────────────────────────
          def mom_score(sym):
              h = price_history.get(sym, [])
              if len(h) < 10: return -999
              ret = (h[-1]['c'] - h[0]['c']) / h[0]['c'] * 100 if h[0]['c'] else 0
              vol = math.log10(max(sum(x['v'] for x in h) / len(h), 1))
              return ret + vol * 3

          def fund_score(sym):
              f = fundamentals.get(sym, {})
              if not f: return -999
              try:
                  s  = min(float(f.get('ROE') or 0), 30)
                  s += max(0, 20 - float(f.get('DebtToEquity') or 99) * 5)
                  s += min(float(f.get('NetProfitMargin') or 0), 20)
                  s += min(float(f.get('CurrentRatio') or 0) * 5, 15)
                  return s
              except: return -999

          # ── Select stocks by category ──────────────────────────────────────
          all_syms = [s for s in price_history if s in latest_prices and len(price_history[s]) >= 10]
          fund_syms = [s for s in all_syms if s in fundamentals]

          def top_n(pool, fn, n):
              return sorted(pool, key=fn, reverse=True)[:n]

          selected = {}  # sym -> category

          for s in top_n(all_syms, mom_score, TOP_N):
              selected[s] = 'Top Momentum'
          for s in top_n(fund_syms, fund_score, TOP_N):
              if s not in selected: selected[s] = 'Top Fundamentals'
          for s in top_n([s for s in all_syms if cap_map.get(s) == 'LargeCap'], mom_score, 5):
              if s not in selected: selected[s] = 'Large Cap'
          for s in top_n([s for s in all_syms if cap_map.get(s) == 'MidCap'], mom_score, 5):
              if s not in selected: selected[s] = 'Mid Cap'
          for s in top_n([s for s in all_syms if cap_map.get(s) == 'SmallCap'], mom_score, 5):
              if s not in selected: selected[s] = 'Small Cap'
          # Long term: best fundamentals with lower momentum (quality dip)
          lt_pool = [s for s in fund_syms if fund_score(s) > 20]
          for s in top_n(lt_pool, lambda s: fund_score(s) - max(0, mom_score(s) * 0.3), 5):
              if s not in selected: selected[s] = 'Long Term Pick'

          top_syms = list(selected.keys())
          print(f'\nSelected {len(top_syms)} stocks:')
          for cat in ['Top Momentum','Top Fundamentals','Large Cap','Mid Cap','Small Cap','Long Term Pick']:
              in_cat = [s for s,c in selected.items() if c==cat]
              if in_cat: print(f'  {cat}: {", ".join(in_cat)}')

          # ── Discover working model ─────────────────────────────────────────
          CANDIDATES = [
              'gemini-flash-lite-latest',
              'gemini-flash-latest',
              'gemini-2.0-flash-lite-001',
              'gemini-2.0-flash-001',
          ]

          WORKING_URL = None
          WORKING_MODEL = None

          print(f'\nFinding working model...')
          for cand in CANDIDATES:
              url = f'https://generativelanguage.googleapis.com/v1beta/models/{cand}:generateContent?key={API_KEY}'
              try:
                  body = json.dumps({'contents':[{'parts':[{'text':'Say OK'}]}],
                                     'generationConfig':{'maxOutputTokens':5}}).encode()
                  req = urllib.request.Request(url, data=body, headers={'Content-Type':'application/json'}, method='POST')
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      json.loads(resp.read())
                  print(f'  OK: {cand}')
                  WORKING_URL = url
                  WORKING_MODEL = cand
                  break
              except urllib.error.HTTPError as e:
                  body = ''
                  try: body = e.read().decode('utf-8','replace')[:120]
                  except: pass
                  print(f'  FAIL {cand}: HTTP {e.code} {body[:80]}')
                  time.sleep(2)
              except Exception as e:
                  print(f'  FAIL {cand}: {e}')
                  time.sleep(2)

          if not WORKING_URL:
              print('No working model found.')
              write_out({}, 'none', 'All models failed — quota exhausted or restricted')
              exit(0)

          print(f'Using: {WORKING_MODEL}')

          # ── Build prompt ───────────────────────────────────────────────────
          def build_prompt(sym):
              d = latest_prices.get(sym, {})
              f = fundamentals.get(sym, {})
              h = price_history.get(sym, [])

              data_lines = [
                  f'Symbol: {sym}',
                  f'Company: {d.get("name", sym)}',
                  f'Current Price: Rs.{d.get("price", 0):.2f}',
                  f'Change today: {d.get("change_pct", 0):.2f}%',
              ]
              if len(h) >= 20:
                  closes = [x['c'] for x in h]
                  vols   = [x['v'] for x in h]
                  r10 = (closes[-1]-closes[-10])/closes[-10]*100 if closes[-10] else 0
                  r30 = (closes[-1]-closes[0])/closes[0]*100 if closes[0] else 0
                  avg_vol = sum(vols)/len(vols)
                  recent_vol = sum(vols[-5:])/5
                  vol_surge = recent_vol/avg_vol if avg_vol else 1
                  hi52 = max(closes)
                  lo52 = min(closes)
                  pct_from_hi = (closes[-1]-hi52)/hi52*100
                  pct_from_lo = (closes[-1]-lo52)/lo52*100
                  data_lines += [
                      f'10-day return: {r10:.1f}%',
                      f'30-day return: {r30:.1f}%',
                      f'52-week high: Rs.{hi52:.2f} (current is {pct_from_hi:.1f}% from high)',
                      f'52-week low: Rs.{lo52:.2f} (current is {pct_from_lo:.1f}% from low)',
                      f'Volume surge vs 30-day avg: {vol_surge:.2f}x',
                  ]
              if f:
                  if f.get('Segment'):         data_lines.append(f'Sector: {f["Segment"]}')
                  if f.get('ROE'):             data_lines.append(f'Return on Equity (ROE): {f["ROE"]}%')
                  if f.get('DebtToEquity'):    data_lines.append(f'Debt to Equity: {f["DebtToEquity"]}')
                  if f.get('NetProfitMargin'): data_lines.append(f'Net Profit Margin: {f["NetProfitMargin"]}%')
                  if f.get('OperatingMargin'): data_lines.append(f'Operating Margin: {f["OperatingMargin"]}%')
                  if f.get('EPS'):             data_lines.append(f'EPS (annual): Rs.{f["EPS"]}')
                  if f.get('CurrentRatio'):    data_lines.append(f'Current Ratio: {f["CurrentRatio"]}')
                  if f.get('BookValuePerShare'):data_lines.append(f'Book Value per Share: Rs.{f["BookValuePerShare"]}')
                  if f.get('RevenueCr'):       data_lines.append(f'Revenue: Rs.{f["RevenueCr"]} Cr')
                  if f.get('NetProfitCr'):     data_lines.append(f'Net Profit: Rs.{f["NetProfitCr"]} Cr')
                  if f.get('ROA'):             data_lines.append(f'Return on Assets: {f["ROA"]}%')

              data_block = '\n'.join(data_lines)

              json_format = '{"headline":"...","summary":"...","technicalView":"...","fundamentalView":"...","positives":["...","...","..."],"concerns":["...","...","..."],"watchFor":"..."}'

              prompt_parts = [
                  'You are a senior equity research analyst covering Indian NSE stocks.',
                  'Analyse the stock data below and produce a detailed research note.',
                  'Reply ONLY with a single valid JSON object. No markdown, no code blocks, no extra text.',
                  '',
                  'Required JSON keys (all required):',
                  '- headline: 8-10 word punchy headline summarising the situation',
                  '- summary: 2-3 sentences covering momentum, valuation, and business quality',
                  '- technicalView: 1-2 sentences on price action, trend, volume, 52-week range',
                  '- fundamentalView: 1-2 sentences on ROE, debt, margins, valuation (say "No fundamental data available" if missing)',
                  '- positives: array of exactly 3 specific data-backed strengths (10-15 words each)',
                  '- concerns: array of exactly 3 specific data-backed risks (10-15 words each)',
                  '- watchFor: one specific signal or catalyst to watch for next',
                  '',
                  'Format example: ' + json_format,
                  '',
                  'Rules: no buy/sell/hold advice, no price targets, all observations must cite actual numbers.',
                  '',
                  'Stock data:',
                  data_block
              ]
              return '\n'.join(prompt_parts)

          # ── Call Gemini ────────────────────────────────────────────────────
          def call_gemini(sym):
              for attempt in range(3):
                  try:
                      prompt = build_prompt(sym)
                      body = json.dumps({
                          'contents': [{'parts': [{'text': prompt}]}],
                          'generationConfig': {'temperature': 0.3, 'maxOutputTokens': 800}
                      }).encode('utf-8')
                      req = urllib.request.Request(WORKING_URL, data=body,
                            headers={'Content-Type': 'application/json'}, method='POST')
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          raw = json.loads(resp.read())
                      text = raw['candidates'][0]['content']['parts'][0]['text'].strip()
                      # Strip any markdown fences
                      if '```' in text:
                          text = text.split('```')[1]
                          if text.startswith('json'): text = text[4:]
                          text = text.strip()
                      # Extract JSON object
                      s, e = text.find('{'), text.rfind('}')
                      if s >= 0 and e > s: text = text[s:e+1]
                      parsed = json.loads(text)
                      if 'summary' in parsed and 'positives' in parsed and 'concerns' in parsed:
                          return sym, parsed
                      # Accept partial response — at minimum need summary
                      if 'summary' in parsed:
                          return sym, parsed
                      return sym, {'error': f'Bad keys: {list(parsed.keys())}'}
                  except urllib.error.HTTPError as e:
                      body = ''
                      try: body = e.read().decode('utf-8','replace')[:200]
                      except: pass
                      if e.code == 429 and attempt < 2:
                          wait = 30 * (attempt + 1)
                          print(f'  Rate limit on {sym}, waiting {wait}s...')
                          time.sleep(wait)
                          continue
                      return sym, {'error': f'HTTP {e.code}: {body[:150]}'}
                  except json.JSONDecodeError as e:
                      print(f'  JSON error {sym} attempt {attempt+1}: {e}')
                      if attempt < 2: time.sleep(3); continue
                      return sym, {'error': f'JSON parse: {e}'}
                  except Exception as e:
                      return sym, {'error': f'{type(e).__name__}: {e}'}
              return sym, {'error': 'Max retries'}

          # ── Process ────────────────────────────────────────────────────────
          insights = {}
          errors   = 0
          start    = time.time()

          for i, sym in enumerate(top_syms):
              if i > 0: time.sleep(DELAY)
              sym_name, result = call_gemini(sym)
              if 'error' in result:
                  errors += 1
                  print(f'  ERR ({i+1}/{len(top_syms)}) {sym}: {result["error"][:100]}')
              else:
                  result['category'] = selected.get(sym, '')
                  result['name']      = latest_prices.get(sym, {}).get('name', sym)
                  result['price']     = latest_prices.get(sym, {}).get('price', 0)
                  result['changePct'] = round(latest_prices.get(sym, {}).get('change_pct', 0), 2)
                  insights[sym] = result
                  print(f'  OK  ({i+1}/{len(top_syms)}) {sym}: {result["summary"][:70]}')

          write_out(insights, WORKING_MODEL)
          print(f'\nDone in {time.time()-start:.0f}s: {len(insights)} insights, {errors} errors.')

          # ── HISTORICAL BACKTESTING ────────────────────────────────────────
          # This works from your existing bhavcopy files — no snapshots needed.
          # For each historical date, compute what the scores would have been,
          # then measure what actually happened 5/10/30 days later.
          print('\n📊 Running historical backtesting from bhavcopy data...')

          # Build full price lookup: date -> sym -> {close, open, high, low, volume}
          print('Building full price lookup...')
          price_lookup = {}   # date -> sym -> close
          names_lookup = {}   # sym -> name
          for fp in bhav_files:
              d = os.path.basename(fp).replace('.csv','')
              price_lookup[d] = {}
              try:
                  with open(fp, encoding='utf-8-sig') as f:
                      for row in csv.DictReader(f):
                          if (row.get('SctySrs') or '').strip() != 'EQ': continue
                          sym = (row.get('TckrSymb') or '').strip().upper()
                          try:
                              c = float(row.get('ClsPric') or 0)
                              if c:
                                  price_lookup[d][sym] = c
                                  if sym not in names_lookup:
                                      names_lookup[sym] = (row.get('FinInstrmNm') or sym).strip()
                          except: pass
              except: pass

          all_dates = sorted(price_lookup.keys())
          print(f'Price lookup: {len(all_dates)} dates, {len(names_lookup)} symbols')

          # Simple scoring function for backtesting
          # Uses only price data (no fundamentals) for speed
          def quick_score(sym, date_idx, all_dates, price_lookup):
              if date_idx < 22: return None
              closes = []
              volumes = []
              for di in range(max(0, date_idx-250), date_idx+1):
                  p = price_lookup[all_dates[di]].get(sym)
                  if p: closes.append(p)
                  else: closes.append(closes[-1] if closes else None)
              closes = [c for c in closes if c]
              if len(closes) < 22: return None

              score = 0
              n = len(closes)

              # 5-day ROC
              if n >= 6:
                  r5 = (closes[-1]-closes[-6])/closes[-6]*100 if closes[-6] else 0
                  score += min(max(r5,0), 12)

              # 10-day ROC
              if n >= 11:
                  r10 = (closes[-1]-closes[-11])/closes[-11]*100 if closes[-11] else 0
                  score += min(max(r10,0), 8)

              # SMA20
              if n >= 20:
                  sma20 = sum(closes[-20:])/20
                  score += 10 if closes[-1] > sma20 else 0
                  if n >= 25:
                      sma20_prev = sum(closes[-25:-5])/20
                      score += 8 if sma20 > sma20_prev else 0

              # RSI simplified
              if n >= 15:
                  gains = [max(closes[i]-closes[i-1],0) for i in range(-14,0)]
                  losses = [max(closes[i-1]-closes[i],0) for i in range(-14,0)]
                  ag = sum(gains)/14; al = sum(losses)/14
                  r = 100 - 100/(1+ag/al) if al else 100
                  if 55<=r<=65: score+=12
                  elif 50<=r<55 or 65<r<=70: score+=8
                  elif 70<r<=80: score+=3
                  elif r>80: score-=4

              # 52-week high
              hi = max(closes)
              pct = (closes[-1]-hi)/hi*100
              score += 6 if pct>=-3 else (4 if pct>=-10 else (2 if pct>=-20 else 0))

              return max(0, min(100, round(score)))

          # Sample every 5th trading day over last 12 months (for speed)
          backtest_dates = all_dates[-250::5]  # every 5th day over last ~12 months
          WINDOWS = [5, 10, 30]

          results_by_verdict = {'BUY':[], 'HOLD':[], 'AVOID':[]}
          factor_data = {
              'roc5':[], 'roc10':[], 'vsma20':[], 'sma20dir':[],
              'rsi':[], 'hi52':[]
          }
          wins, misses = [], []

          print(f'Backtesting {len(backtest_dates)} sample dates x top symbols...')

          # Only test top 200 symbols by total volume (for speed)
          vol_totals = {}
          for d_prices in price_lookup.values():
              for sym in d_prices:
                  vol_totals[sym] = vol_totals.get(sym, 0) + 1
          test_syms = sorted(vol_totals, key=vol_totals.get, reverse=True)[:300]

          for date_str in backtest_dates:
              di = all_dates.index(date_str)
              if di + 5 >= len(all_dates): continue  # need future data

              for sym in test_syms:
                  if sym not in price_lookup.get(date_str, {}): continue

                  sc = quick_score(sym, di, all_dates, price_lookup)
                  if sc is None: continue

                  # Get 5-day actual return
                  future_di = min(di + 5, len(all_dates)-1)
                  p_now    = price_lookup[date_str].get(sym)
                  p_future = price_lookup[all_dates[future_di]].get(sym)
                  if not p_now or not p_future: continue
                  ret5 = (p_future - p_now) / p_now * 100

                  verdict = 'BUY' if sc >= 65 else ('AVOID' if sc < 40 else 'HOLD')
                  results_by_verdict[verdict].append(ret5)

                  if verdict == 'BUY':
                      if ret5 > 8:  wins.append((sym, date_str, sc, round(ret5,2)))
                      elif ret5 < -5: misses.append((sym, date_str, sc, round(ret5,2)))

          # Compute accuracy stats
          def stats(returns):
              if not returns: return {'avg':0,'win_rate':0,'count':0}
              avg = sum(returns)/len(returns)
              win_rate = sum(1 for r in returns if r>0)/len(returns)*100
              return {'avg':round(avg,2),'win_rate':round(win_rate,1),'count':len(returns)}

          accuracy = {v: stats(r) for v,r in results_by_verdict.items()}
          wins.sort(key=lambda x: x[3], reverse=True)
          misses.sort(key=lambda x: x[3])
          print(f'Backtesting complete: BUY avg={accuracy["BUY"]["avg"]}%, n={accuracy["BUY"]["count"]}')

          # ── Send to Gemini for interpretation ──
          calib_result = None
          if WORKING_URL and accuracy['BUY']['count'] > 50:
              print('Generating calibration report...')
              time.sleep(DELAY)

              lines = [
                  'You are a quantitative analyst reviewing a stock scoring model.',
                  'Below is historical backtesting data. Write a calibration report.',
                  'Reply ONLY with valid JSON, no markdown, no extra text.',
                  '',
                  'Required JSON:',
                  '{"overallVerdict":"2-3 sentences on model accuracy and whether BUY/HOLD/AVOID signals are well-separated","factorInsights":["3-4 specific observations"],"recommendations":["3 specific suggestions to improve the model"],"calibrationScore":"X/10 rating of model quality"}',
                  '',
                  'BACKTESTING RESULTS (5-day return after signal, from historical NSE data):',
                  f'BUY (score >= 65): avg={accuracy["BUY"]["avg"]}%, win_rate={accuracy["BUY"]["win_rate"]}%, n={accuracy["BUY"]["count"]}',
                  f'HOLD (40-64):      avg={accuracy["HOLD"]["avg"]}%, win_rate={accuracy["HOLD"]["win_rate"]}%, n={accuracy["HOLD"]["count"]}',
                  f'AVOID (< 40):      avg={accuracy["AVOID"]["avg"]}%, win_rate={accuracy["AVOID"]["win_rate"]}%, n={accuracy["AVOID"]["count"]}',
                  '',
                  'TOP 3 WINS (BUY signal, high return):',
              ]
              for sym,d,sc,r in wins[:3]:
                  lines.append(f'  {sym} on {d}: score={sc}, 5d return=+{r}%')
              lines.append('TOP 3 MISSES (BUY signal, negative return):')
              for sym,d,sc,r in misses[:3]:
                  lines.append(f'  {sym} on {d}: score={sc}, 5d return={r}%')

              try:
                  body = json.dumps({
                      'contents': [{'parts': [{'text': chr(10).join(lines)}]}],
                      'generationConfig': {'temperature':0.3,'maxOutputTokens':800}
                  }).encode('utf-8')
                  req = urllib.request.Request(WORKING_URL, data=body,
                        headers={'Content-Type':'application/json'}, method='POST')
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      raw = json.loads(resp.read())
                  text = raw['candidates'][0]['content']['parts'][0]['text'].strip()
                  if '```' in text:
                      text = text.split('```')[1]
                      if text.startswith('json'): text = text[4:]
                      text = text.strip()
                  s,e = text.find('{'), text.rfind('}')
                  if s>=0 and e>s: text=text[s:e+1]
                  calib_result = json.loads(text)
                  print(f'Calibration report generated.')
              except Exception as e:
                  print(f'Calibration API error: {e}')

          # Save calibration to insights.json
          try:
              with open(OUT_FILE) as f: existing = json.load(f)
          except: existing = {}

          existing['calibration'] = {
              'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
              'accuracy': accuracy,
              'topWins':  [list(x) for x in wins[:5]],
              'topMisses':[list(x) for x in misses[:5]],
              'aiReport': calib_result,
              'dataPoints': accuracy['BUY']['count'] + accuracy['HOLD']['count'] + accuracy['AVOID']['count']
          }
          with open(OUT_FILE, 'w', encoding='utf-8') as f:
              json.dump(existing, f, ensure_ascii=False, indent=1)
          print(f'Calibration saved to {OUT_FILE}')
          EOF
              snap_files = sorted(glob.glob(f'{SNAP_DIR}/*.json'))
              print(f'Found {len(snap_files)} snapshots.')

              # Load all bhavcopy closing prices into a lookup: date -> sym -> close
              print('Building price lookup...')
              price_lookup = {}   # date_str -> sym -> close
              for fp in bhav_files:
                  d = os.path.basename(fp).replace('.csv','')
                  price_lookup[d] = {}
                  try:
                      with open(fp, encoding='utf-8-sig') as f:
                          for row in csv.DictReader(f):
                              if (row.get('SctySrs') or '').strip() != 'EQ': continue
                              sym = (row.get('TckrSymb') or '').strip().upper()
                              try:
                                  c = float(row.get('ClsPric') or 0)
                                  if c: price_lookup[d][sym] = c
                              except: pass
                  except: pass

              all_dates = sorted(price_lookup.keys())

              def get_future_return(sym, snap_date, window):
                  """Get actual return for sym, window days after snap_date."""
                  try:
                      idx = all_dates.index(snap_date)
                  except ValueError: return None
                  future_idx = idx + window
                  if future_idx >= len(all_dates): return None
                  future_date = all_dates[future_idx]
                  p_now    = price_lookup.get(snap_date, {}).get(sym)
                  p_future = price_lookup.get(future_date, {}).get(sym)
                  if not p_now or not p_future: return None
                  return (p_future - p_now) / p_now * 100

              # ── Analyse predictions vs outcomes ──
              # For each snapshot (that has future data), measure accuracy
              results_by_verdict = {'BUY': [], 'HOLD': [], 'AVOID': []}
              factor_returns = {}   # factor_name -> [(factor_score, actual_return)]
              wins = []    # [(sym, snap_date, pred_score, actual_return_5d)]
              misses = []  # same

              for snap_file in snap_files[-60:]:  # last 60 snapshots
                  try:
                      with open(snap_file) as f: snap = json.load(f)
                      snap_date = snap.get('date', '')
                      if not snap_date: continue

                      for sym, s in snap.get('stocks', {}).items():
                          ret5 = get_future_return(sym, snap_date, 5)
                          if ret5 is None: continue

                          combined = s.get('combined', s.get('techScore', 50))
                          verdict = 'BUY' if combined >= 65 else ('AVOID' if combined < 40 else 'HOLD')
                          results_by_verdict[verdict].append(ret5)

                          # Factor attribution
                          for factor, pts in s.get('factors', {}).items():
                              factor_returns.setdefault(factor, []).append((pts, ret5))

                          # Track notable wins and misses for BUY predictions
                          if verdict == 'BUY':
                              entry = (sym, snap_date, combined, ret5)
                              if ret5 > 8:  wins.append(entry)
                              elif ret5 < -5: misses.append(entry)
                  except Exception as e:
                      print(f'  Error reading {snap_file}: {e}')

              # Sort wins/misses
              wins.sort(key=lambda x: x[3], reverse=True)
              misses.sort(key=lambda x: x[3])

              # Compute factor predictive power
              factor_power = {}
              for factor, pairs in factor_returns.items():
                  if len(pairs) < 20: continue
                  # Correlation: do higher scores -> better returns?
                  high_score = [r for s,r in pairs if s >= 6]
                  low_score  = [r for s,r in pairs if s <= 2]
                  if high_score and low_score:
                      diff = sum(high_score)/len(high_score) - sum(low_score)/len(low_score)
                      factor_power[factor] = round(diff, 2)

              # Summary stats
              def stats(returns):
                  if not returns: return {'avg': 0, 'win_rate': 0, 'count': 0}
                  avg = sum(returns)/len(returns)
                  win_rate = sum(1 for r in returns if r > 0) / len(returns) * 100
                  return {'avg': round(avg,2), 'win_rate': round(win_rate,1), 'count': len(returns)}

              accuracy = {v: stats(r) for v,r in results_by_verdict.items()}
              print(f'Backtesting: BUY={accuracy["BUY"]["count"]} predictions, avg return={accuracy["BUY"]["avg"]}%')

              # ── Send to Gemini for interpretation ──
              if WORKING_URL and accuracy['BUY']['count'] > 10:
                  print('Sending backtesting results to Gemini...')
                  time.sleep(DELAY)

                  calib_lines = [
                      'You are a quantitative equity analyst reviewing a stock scoring model.',
                      'Below is backtesting data showing how the model\'s predictions performed.',
                      'Write a calibration report interpreting these results.',
                      'Reply ONLY with valid JSON, no markdown.',
                      '',
                      'Required JSON:',
                      '{"overallVerdict":"2-3 sentences on model accuracy","factorInsights":["3-4 specific observations about which factors work well or poorly"],"recommendations":["3 specific actionable suggestions to improve the scoring weights"],"topWins":["2 examples of best predictions with explanation"],"topMisses":["2 examples of worst predictions with explanation"],"calibrationScore":"a score out of 10 rating how well the model is calibrated"}',
                      '',
                      f'PREDICTION ACCURACY (5-day return after signal):',
                      f'BUY signal (score >= 65): avg return={accuracy["BUY"]["avg"]}%, win rate={accuracy["BUY"]["win_rate"]}%, n={accuracy["BUY"]["count"]}',
                      f'HOLD signal (40-64): avg return={accuracy["HOLD"]["avg"]}%, win rate={accuracy["HOLD"]["win_rate"]}%, n={accuracy["HOLD"]["count"]}',
                      f'AVOID signal (< 40): avg return={accuracy["AVOID"]["avg"]}%, win rate={accuracy["AVOID"]["win_rate"]}%, n={accuracy["AVOID"]["count"]}',
                      '',
                      'FACTOR PREDICTIVE POWER (avg return difference: high score vs low score):',
                  ]
                  FACTOR_LABELS = {
                      'roc5':'5-Day Momentum','roc10':'10-Day Momentum',
                      'vsma20':'Price vs SMA20','sma20dir':'SMA20 Direction',
                      'rsi':'RSI','volume':'Volume Surge',
                      'relstrength':'Relative Strength','macd':'MACD',
                      'bollinger':'Bollinger Bands','hi52':'52-Week High',
                      'gap':'Price Gap','cross':'Golden/Death Cross','adx':'ADX'
                  }
                  for factor, power in sorted(factor_power.items(), key=lambda x: abs(x[1]), reverse=True):
                      label = FACTOR_LABELS.get(factor, factor)
                      signal = '✅ Predictive' if power > 1 else ('⚠️ Weak' if power > 0 else '❌ Counter-predictive')
                      calib_lines.append(f'  {label}: +{power}% edge  {signal}')

                  calib_lines.append('')
                  calib_lines.append('TOP WINS (BUY predicted, high actual return):')
                  for sym, snap_date, score, ret in wins[:3]:
                      calib_lines.append(f'  {sym} on {snap_date}: score={score}, actual 5d return={ret:+.1f}%')

                  calib_lines.append('')
                  calib_lines.append('TOP MISSES (BUY predicted, negative actual return):')
                  for sym, snap_date, score, ret in misses[:3]:
                      calib_lines.append(f'  {sym} on {snap_date}: score={score}, actual 5d return={ret:+.1f}%')

                  calib_prompt = '\n'.join(calib_lines)
                  calib_result = None

                  for attempt in range(2):
                      try:
                          body = json.dumps({
                              'contents': [{'parts': [{'text': calib_prompt}]}],
                              'generationConfig': {'temperature': 0.3, 'maxOutputTokens': 1000}
                          }).encode('utf-8')
                          req = urllib.request.Request(WORKING_URL, data=body,
                                headers={'Content-Type':'application/json'}, method='POST')
                          with urllib.request.urlopen(req, timeout=45) as resp:
                              raw = json.loads(resp.read())
                          text = raw['candidates'][0]['content']['parts'][0]['text'].strip()
                          if '```' in text:
                              text = text.split('```')[1]
                              if text.startswith('json'): text = text[4:]
                              text = text.strip()
                          s, e = text.find('{'), text.rfind('}')
                          if s >= 0 and e > s: text = text[s:e+1]
                          calib_result = json.loads(text)
                          print(f'  Calibration report generated.')
                          break
                      except urllib.error.HTTPError as he:
                          if he.code == 429 and attempt == 0:
                              print('  Rate limit on calibration, waiting 30s...')
                              time.sleep(30); continue
                          print(f'  Calibration API error: {he.code}'); break
                      except Exception as e:
                          print(f'  Calibration error: {e}'); break

                  # Save calibration data to insights.json
                  try:
                      with open(OUT_FILE) as f: existing = json.load(f)
                  except: existing = {}

                  existing['calibration'] = {
                      'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                      'accuracy': accuracy,
                      'factorPower': factor_power,
                      'topWins':  [(s,d,sc,r) for s,d,sc,r in wins[:5]],
                      'topMisses':[(s,d,sc,r) for s,d,sc,r in misses[:5]],
                      'aiReport': calib_result
                  }
                  with open(OUT_FILE, 'w', encoding='utf-8') as f:
                      json.dump(existing, f, ensure_ascii=False, indent=1)
                  print(f'Calibration data saved to {OUT_FILE}')
              else:
                  print('Not enough predictions yet for meaningful backtesting (need 10+ BUY predictions).')
                  print('Run the save-snapshots workflow daily for a few weeks first.')
          EOF — one AI call analysing top stocks across 4 timeframes ──
          print('\n📡 Building Momentum Radar...')

          TIMEFRAMES = [
              ('1W',  5,  '1 Week'),
              ('2W',  10, '2 Weeks'),
              ('1M',  22, '1 Month'),
              ('6M',  132,'6 Months'),
          ]

          def get_return(sym, sessions):
              h = price_history.get(sym, [])
              if len(h) < sessions: return None
              start_c = h[-sessions]['c']
              end_c   = h[-1]['c']
              return (end_c - start_c) / start_c * 100 if start_c else None

          def get_vol_surge(sym, sessions):
              h = price_history.get(sym, [])
              if len(h) < 30: return 1.0
              recent = sum(x['v'] for x in h[-sessions:]) / sessions
              avg30  = sum(x['v'] for x in h[-30:]) / 30
              return round(recent / avg30, 2) if avg30 else 1.0

          # Build a compact data table for each timeframe
          radar_data = {}
          for tf_key, sessions, tf_label in TIMEFRAMES:
              # Get all symbols with enough history
              candidates = []
              for sym in all_syms:
                  ret = get_return(sym, sessions)
                  if ret is None: continue
                  f = fundamentals.get(sym, {})
                  d = latest_prices.get(sym, {})
                  candidates.append({
                      'sym': sym,
                      'name': d.get('name', sym),
                      'return': ret,
                      'price': d.get('price', 0),
                      'volSurge': get_vol_surge(sym, min(sessions, 5)),
                      'cap': cap_map.get(sym, ''),
                      'roe': f.get('ROE', ''),
                      'de': f.get('DebtToEquity', ''),
                      'npm': f.get('NetProfitMargin', ''),
                  })
              # Sort by return, take top 15 for AI to consider
              candidates.sort(key=lambda x: x['return'], reverse=True)
              radar_data[tf_key] = {'label': tf_label, 'sessions': sessions, 'top': candidates[:15]}

          # Build one compact prompt with all 4 timeframes
          radar_lines = [
              'You are an equity research analyst covering Indian NSE stocks.',
              'Below is performance data for top stocks across 4 momentum timeframes.',
              'For each timeframe, pick the 3 most interesting stocks and explain why.',
              'Consider: Is the momentum backed by volume? Quality fundamentals? Broad market or sector-specific?',
              'Avoid stocks that appear across multiple timeframes unless the case is exceptional.',
              'Reply ONLY with valid JSON, no markdown.',
              '',
              'Required format:',
              '{"1W":{"picks":[{"sym":"SYMBOL","name":"Company Name","return":12.5,"reason":"2-3 sentence analyst note grounded in the data"}]},"2W":{...},"1M":{...},"6M":{...},"marketPulse":"2-3 sentences on overall market conditions and what the momentum patterns suggest"}',
              '',
              'Rules: no buy/sell/hold, no price targets, cite actual numbers, be specific.',
              '',
          ]

          for tf_key, sessions, tf_label in TIMEFRAMES:
              data = radar_data[tf_key]
              radar_lines.append(f'--- {tf_label} Top Performers ---')
              for c in data['top']:
                  parts = [f'{c["sym"]} ({c["name"][:25]}): {c["return"]:+.1f}% return']
                  parts.append(f'Price Rs.{c["price"]:.2f}')
                  if c['volSurge'] != 1.0: parts.append(f'Vol surge {c["volSurge"]}x')
                  if c['cap']: parts.append(c['cap'])
                  if c['roe']: parts.append(f'ROE {c["roe"]}%')
                  if c['de']:  parts.append(f'D/E {c["de"]}')
                  if c['npm']: parts.append(f'Margin {c["npm"]}%')
                  radar_lines.append('  ' + ' | '.join(parts))
              radar_lines.append('')

          radar_prompt = '\n'.join(radar_lines)

          # Single Gemini call for the entire radar
          radar_result = None
          for attempt in range(3):
              try:
                  body = json.dumps({
                      'contents': [{'parts': [{'text': radar_prompt}]}],
                      'generationConfig': {'temperature': 0.4, 'maxOutputTokens': 1500}
                  }).encode('utf-8')
                  req = urllib.request.Request(WORKING_URL, data=body,
                        headers={'Content-Type': 'application/json'}, method='POST')
                  with urllib.request.urlopen(req, timeout=45) as resp:
                      raw = json.loads(resp.read())
                  text = raw['candidates'][0]['content']['parts'][0]['text'].strip()
                  if '```' in text:
                      text = text.split('```')[1]
                      if text.startswith('json'): text = text[4:]
                      text = text.strip()
                  s, e = text.find('{'), text.rfind('}')
                  if s >= 0 and e > s: text = text[s:e+1]
                  radar_result = json.loads(text)
                  print(f'  Radar generated: {list(radar_result.keys())}')
                  break
              except urllib.error.HTTPError as e:
                  body = ''
                  try: body = e.read().decode('utf-8','replace')[:200]
                  except: pass
                  if e.code == 429 and attempt < 2:
                      print(f'  Rate limit on radar, waiting 30s...')
                      time.sleep(30); continue
                  print(f'  Radar failed: HTTP {e.code}: {body[:100]}')
                  break
              except Exception as e:
                  print(f'  Radar error: {e}')
                  if attempt < 2: time.sleep(5); continue
                  break

          # Re-read the existing insights.json and add radar to it
          try:
              with open(OUT_FILE) as f:
                  existing = json.load(f)
          except:
              existing = {'updatedAt': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
                          'model': WORKING_MODEL, 'count': 0, 'insights': {}}

          if radar_result:
              existing['radar'] = radar_result
              existing['radarUpdatedAt'] = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())

          with open(OUT_FILE, 'w', encoding='utf-8') as f:
              json.dump(existing, f, ensure_ascii=False, indent=1)

          print(f'Radar written to {OUT_FILE}')
          print(f'\nAll done in {time.time()-start:.0f}s.')
          EOF

